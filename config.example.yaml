# Harle configuration file.
#
# Copy this file to "config.yaml" (which is git-ignored) and adjust
# values for your local environment.  Every key is optional — missing
# keys fall back to the same-named environment variable and then to
# built-in defaults.
#
# Keys use the exact same names as the corresponding environment
# variables — one canonical name everywhere.
#
# You can also override the config file path with the HARLE_CONFIG_PATH
# environment variable.

# --- Server ---
HARLE_HOST: "127.0.0.1"
HARLE_PORT: 8000

# --- LLM ---
HARLE_LLM_PROVIDER: "openai"
# OPENAI_API_KEY — read exclusively from the environment variable; never put it in this file.

# --- Model tiers (required non-empty) ---
HARLE_MODEL_CLASSIFIER: "gpt-4o-mini"   # routing / classification
HARLE_MODEL_PLANNER: "gpt-4o"            # planning + reflection critic
HARLE_MODEL_EXECUTOR: "gpt-4o-mini"      # execution, handoffs, improvement pass, legacy provider
# Boost execution to planner tier when the local complexity classifier returns "complex":
# HARLE_COMPLEX_EXECUTION_TIER: "executor"   # or "planner"

# --- External data (per-user, never committed) ---
# HARLE_DATASET_PATH: "/path/to/harle-vault"
# DATABASE_URL: "postgresql+psycopg2://harle:harle@localhost:5432/harle"

# --- Agentic loop ---
HARLE_MAX_ITERATIONS: 10             # Max reasoning turns per request (tool-calling loop)

# --- Level 3 plan-then-execute ---
# HARLE_PLANNING_ENABLED: true        # false = skip planning (Level 2 only)
# HARLE_PLANNING_MAX_TURNS: 5         # Max turns for the planning agent (may use tools)
# HARLE_PLANNED_MAX_TURNS: null       # Max execution turns when a plan was used; null = HARLE_MAX_ITERATIONS

# --- Run logging (vault logs/ directory) ---
HARLE_RUN_LOG_STORE_CONTEXT: true   # Set true to save assembled prompt in logs/ (larger, for debugging)

# --- Tool modules ---
# Web search requires TAVILY_API_KEY env var.
# Vault tools (dataset_search, dataset_read_file) are enabled automatically
# when HARLE_DATASET_PATH is configured.
#
# Per-role tool allowlists (which ToolRegistry modules each agent role may use):
# Copy config/role_tool_modules.example.json and set:
#   HARLE_ROLE_TOOL_MODULES_PATH: "/path/to/role_tool_modules.json"
# Or place role_tool_modules.json at the vault root (HARLE_DATASET_PATH).
# HARLE_ROLE_TOOL_MODULES_PATH: null

# --- Search ---
# search:
#   engine: "whoosh"
#   max_results: 10
#   bm25_weight: 0.35
#   tag_match_weight: 0.20
#   recency_weight: 0.15
#   source_priority_weight: 0.15
#   memory_confidence_weight: 0.10
#   prior_run_weight: 0.05

# --- Chunking ---
# chunking:
#   enabled: true                      # false = one Whoosh doc per file (whole body)
#   knowledge_token_threshold: 2000    # knowledge/ files at or above → H2 section chunks
#   contextual_enrichment: true        # prepend [Source]/[Section]/[Tags]/[Summary] to indexed text
#   paragraph_max_tokens: 600          # logs/ paragraph merge target
#   max_chunks_per_file_in_results: 3  # cap chunks from the same file in ranked results

# --- Vault imports ---
# Options for import sources (harle import ...). Loaded from the vault_imports key.
# vault_imports:
#   notion:
#     max_block_depth: 3    # Max recursion depth when fetching block children (default 3)
#     page_size: 100       # Notion API page size for search/query/blocks (default 100)