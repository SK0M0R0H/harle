name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/ --exit-zero

      - name: Ruff format check
        run: ruff format --check src/ tests/ || true

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: pip install -e '.[test]'

      - name: Run unit tests
        run: pytest -v --tb=short tests/unit

  build-and-push:
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for server to pull new image
        run: |
          echo "Waiting ~8 minutes for the deploy timer to pick up the new image..."
          sleep 480

      - name: Health check
        run: |
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST secret is required for post-deploy verification on main."
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Health check attempt $attempt/3..."
            if curl -fsS --connect-timeout 10 --max-time 15 "http://${DEPLOY_HOST}:8000/health"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 30 seconds..."
              sleep 30
            fi
          done
          echo "::error::Health check failed after 3 attempts. Server may be down after deploy."
          exit 1
