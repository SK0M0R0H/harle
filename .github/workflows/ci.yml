name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy
        run: mypy src/harle --ignore-missing-imports

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: pip install -e '.[test]'

      - name: Run unit tests
        run: pytest -m "not integration and not semantic and not e2e" -v --tb=short

  test-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: harle
          POSTGRES_PASSWORD: test
          POSTGRES_DB: harle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harle -d harle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: pip install -e '.[test]'

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://harle:test@localhost:5432/harle_test
        run: pytest -m "integration" -v --tb=short

  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and coverage deps
        run: pip install -e '.[test]' pytest-cov

      - name: Generate coverage report
        run: >-
          pytest
          -m "not semantic and not e2e"
          --cov=harle
          --cov-report=xml
          --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go tests
        working-directory: harle-cli
        run: go test ./...

      - name: Go vet
        working-directory: harle-cli
        run: go vet ./...
