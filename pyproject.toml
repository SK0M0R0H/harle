[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harle"
version = "0.3.0"
description = "Harle: personal AI assistant with dataset search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.27",
  "openai>=1.100.0",
  "openai-agents>=0.10.0",
  "psycopg2-binary>=2.9.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.0",
  "tiktoken>=0.7.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
harle-server = "harle.main:run"
harle-init = "harle.bootstrap:run_init"
harle-reindex = "harle.bootstrap:run_reindex"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
