[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harle"
version = "0.1.0"
description = "Harle prototype: CLI + simple orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "openai>=1.100.0",
  "pydantic>=2.10.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
harle-server = "harle.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
