[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harle"
version = "0.3.0"
description = "Harle: personal AI assistant with dataset search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.27",
  "openai>=1.100.0",
  "openai-agents>=0.10.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "psycopg2-binary>=2.9.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "sse-starlette>=2.0.0",
  "sqlalchemy>=2.0.0",
  "tiktoken>=0.7.0",
  "uvicorn>=0.35.0",
  "whoosh>=2.7.4",
]

[project.scripts]
harle-server = "harle.main:run"
harle-init = "harle.bootstrap:run_init"
harle-reindex = "harle.bootstrap:run_reindex"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "integration: multi-component tests with real module wiring",
  "e2e: end-to-end tests (real server, optional DB)",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"harle.tools.dummy" = ["skills/*.md"]
"harle.tools.notion" = ["skills/*.md"]
"harle.tools.trello" = ["skills/*.md"]
"harle.tools.web_search" = ["skills/*.md"]
